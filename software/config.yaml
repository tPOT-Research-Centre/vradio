channels:
  - name: AnalogueRadio
    class: channels.internet_radio_analogue.InternetRadioChannel
    button: A
    auto_start: false
    requires_internet: true
    magic_colour: 0xFFF
    image: images/radio.bmp
    stream_url:
      - http://as-hls-ww-live.akamaized.net/pool_01505109/live/ww/bbc_radio_one/bbc_radio_one.isml/bbc_radio_one-audio%3d96000.norewind.m3u8
      - http://as-hls-ww-live.akamaized.net/pool_74208725/live/ww/bbc_radio_two/bbc_radio_two.isml/bbc_radio_two-audio%3d96000.norewind.m3u8
      - http://as-hls-ww-live.akamaized.net/pool_23461179/live/ww/bbc_radio_three/bbc_radio_three.isml/bbc_radio_three-audio%3d96000.norewind.m3u8

  - name: LocalTunes
    class: channels.local_mp3_player.LocalMP3Channel
    auto_start: false
    magic_colour: 0xF000
    button: B
    requires_internet: false
    audio_dir: audio/ai_music
    image: images/main_banner.bmp

  - name: TimeRadio
    class: channels.time_radio.time_demo
    button: C
    auto_start: false
    image: images/banner_image_4bpp.bmp
    requires_internet: true
    playback_device: VradioPlayer
    magic_colour: 0x333

  - name: AI_DJ
    class: channels.local_mp3_player.LocalMP3Channel
    auto_start: false
    magic_colour: 0xF0ff
    button: D
    requires_internet: false
    audio_dir: audio/ai_dj
    image: images/main_banner.bmp



  - name: AIPodCasts
    class: channels.local_mp3_player.LocalMP3Channel
    auto_start: false
    magic_colour: 0xF000
    button: E
    requires_internet: false
    image: images/oasis_banner.bmp
    audio_dir: audio/ai_pods
    filename: Oasis__Gen_Z.m4a

  - name: TedLocalTunes
    class: channels.local_mp3_player_ted.LocalMP3Channel
    auto_start: false
    magic_colour: 0x1F
    button: F
    requires_internet: false
    image: images/sor_banner_draft.bmp
    filename: theblame.mp3

